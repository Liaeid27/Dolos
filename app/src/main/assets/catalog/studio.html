<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dolos · Einstellungen</title><link rel="stylesheet" href="studio.css"></head>
<body><header><button id="back" aria-label="Zurück">‹</button><span class="crumb">Dolos</span><span class="clock"></span></header>
<div class="layout"><div class="sidebar"><h2>Einstellungen</h2><nav aria-label="Darstellung und System"><button data-page="appearance">Darstellung</button><button data-page="video">Bild und Streaming</button><button data-page="audio">Ton</button><button data-page="controller">Controller und Eingabe</button><button data-page="advanced">Weitere Optionen</button><button data-page="system">Konsole und Verbindung</button><button data-page="updates">Systemupdate</button></nav></div>
<main><h1 id="title">Animationen</h1>
<section id="system" hidden><p class="route" hidden></p><div class="settingList"><button data-console="setup">Einrichtungsassistent</button><button data-console="network">Verbindung testen</button><button data-console="pair">PC-Verwaltung koppeln</button><button data-console="storage">Speicher</button><button data-console="profile">Profil wechseln</button><button data-console="power">Energie</button></div></section><section id="appearance" hidden><div class="settingList"><button data-sub="library"><strong>Start und Abschalten</strong><small>Animationen auswählen und verwalten</small></button><button data-sub="homeinfo">Startbildschirm</button><button data-sub="themes"><strong>Erscheinungsbild</strong><small>Layout und Stil deiner Konsole</small></button></div></section>
<section id="streamPage" hidden><div id="optionRows" class="settingList"></div><div id="optionEdit" hidden></div></section>
<section id="library"><div class="tabs"><button data-tab="saved">Gespeichert</button><button data-tab="browse">Entdecken</button></div>
<div class="filters"><input id="search" type="search" placeholder="Titel oder Urheber suchen" aria-label="Animationen durchsuchen"><button id="type"></button><button id="source"></button></div>
<div id="filterChoices" role="group" hidden></div><p id="count"></p><div id="list"></div><div class="pages"><button id="prev">Zurück</button><button id="next">Weitere</button></div></section>
<section id="homeinfo" hidden><div class="settingList"><button data-info="trailerAudio" hidden>Ton bei Trailern auf der Startseite</button><button data-info="time">Spielzeit des Spielstands</button><button data-info="status">Installationsstatus</button><button data-info="recent">Zuletzt gespielt</button></div></section><section id="themes" hidden><div class="designs"><button data-theme="normal"><div class="sample classic"><i></i><i></i><i></i></div><strong>Dolos</strong><small>Horizontale Spielleiste · Graphit</small></button><button data-theme="enhanced"><div class="sample engraved"></div><strong>Dolos Enhanced</strong><small>Vertikale Spielleiste · Kobalt und Bronze</small></button></div></section>
<section id="updates" hidden><article><span class="label">DOLOS SYSTEMSOFTWARE</span><h2 id="version"></h2><p>Dolos sucht auf GitHub nach der neuesten Version für dieses Gerät.</p><button id="check">Nach Update suchen</button><button id="install" hidden></button></article></section>
<section id="details" hidden><div id="art"></div><small id="credit"></small><h2 id="filmTitle"></h2><div id="actions"></div></section>
<p id="status" role="status" aria-live="polite"></p>
</main></div><script src="studio.js"></script><script src="tv-keyboard.js"></script></body></html>
